services:
  php:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: workshop_php
    volumes:
      - .:/var/www/html
    depends_on:
      - mysql
    environment:
      APP_ENV: local
      APP_URL: http://localhost:8080
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: workshop
      DB_USERNAME: workshop
      DB_PASSWORD: workshop

  nginx:
    image: nginx:alpine
    container_name: workshop_nginx
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php

  mysql:
    image: mysql:8.0
    container_name: workshop_mysql
    environment:
      MYSQL_DATABASE: workshop
      MYSQL_USER: workshop
      MYSQL_PASSWORD: workshop
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: workshop_phpmyadmin
    ports:
      - "8081:80"
    environment:
      PMA_HOST: mysql
      MYSQL_ROOT_PASSWORD: root

  node:
    image: node:20-alpine
    container_name: workshop_node
    working_dir: /app
    volumes:
      - .:/app
    command: sh -c "npm install -g sass && sass --watch public/assets/scss/app.scss:public/assets/css/app.css"

volumes:
  mysql_data:
